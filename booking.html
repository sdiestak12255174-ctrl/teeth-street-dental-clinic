<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book an Appointment - Teeth Street Dental Clinic</title>
  <!-- Siguraduhing tama ang path papunta sa CSS file mo -->
  <link rel="stylesheet" href="booking.css">
</head>
<body>
  <main class="booking-wrapper">
    <a href="index.html" class="back-link">&larr; Back to Home</a>

    <header class="booking-header">
      <h1>Book an Appointment</h1>
      <p>Fill out the form and our team will confirm your schedule.</p>
    </header>

    <div class="booking-card">
      <form action="#" method="POST" class="booking-form">
        <!-- Row 1: Full Name & Phone -->
        <div class="form-row">
          <div class="form-group">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="full_name" required>
          </div>

          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" required>
          </div>
        </div>

        <!-- Row 2: Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <!-- Row 3: Service -->
        <div class="form-group">
          <label for="service">Service</label>
          <select id="service" name="service" required>
            <option value="" disabled selected>Select a service</option>
            <option value="cleaning">Oral Prophylaxis (Cleaning)</option>
            <option value="consultation">Dental Check-up & Consultation</option>
            <option value="filling">Tooth Restoration (Pasta)</option>
            <option value="extraction">Tooth Extraction (Bunot)</option>
            <option value="whitening">Teeth Whitening</option>
            <option value="braces">Orthodontics / Braces</option>
          </select>
        </div>

        <!-- Row 4: Preferred Date & Time -->
        <div class="form-row">
          <div class="form-group">
            <label for="date">Preferred Date</label>
            <input type="date" id="date" name="date" required>
          </div>

          <div class="form-group">
            <label for="time">Preferred Time</label>
            <input type="time" id="time" name="time" required>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit">Submit Booking</button>
      </form>
    </div>
  </main>
</body>
</html>
