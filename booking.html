<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book an Appointment - Teeth Street Dental Clinic</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/booking.css">
</head>
<body>

  <main class="page-narrow">
    <a href="index.html" class="back-link">&larr; Back to Home</a>

    <h1 class="section-title" style="text-align:left;">Book an Appointment</h1>
    <p class="section-subtitle" style="text-align:left; margin-bottom:24px;">
      Fill out the form and our team will confirm your schedule.
    </p>

    <div class="booking-card">
      <form class="booking-form" id="bookingForm">

        <div class="form-row">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone / Mobile Number</label>
            <input type="tel" id="phone" placeholder="09XXXXXXXXX or 02XXXXXXXX" maxlength="11" inputmode="numeric" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group">
          <label for="service">Service</label>
          <select id="service" required>
            <option value="">Select a service</option>
            <option>General Dentistry</option>
            <option>Orthodontics</option>
            <option>Cosmetic Dentistry</option>
            <option>Pediatric Dentistry</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date">Preferred Date</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label for="time">Preferred Time</label>
            <select id="time" required>
              <option value="">Select a time slot</option>
              <option value="09:00">9:00 AM</option>
              <option value="10:00">10:00 AM</option>
              <option value="11:00">11:00 AM</option>
              <option value="13:00">1:00 PM</option>
              <option value="14:00">2:00 PM</option>
              <option value="15:00">3:00 PM</option>
              <option value="16:00">4:00 PM</option>
              <option value="17:00">5:00 PM</option>
            </select>
          </div>
        </div>

        <div class="form-message" id="formMessage"></div>

        <button type="submit" class="btn btn-filled" id="submitBtn">Submit Booking</button>
      </form>
    </div>
  </main>

  <script>
    var form = document.getElementById('bookingForm');
    var message = document.getElementById('formMessage');
    var dateInput = document.getElementById('date');
    var timeSelect = document.getElementById('time');
    var phoneInput = document.getElementById('phone');
    var submitBtn = document.getElementById('submitBtn');

    // Hindi pwedeng pumili ng nakaraang petsa
    var today = new Date().toISOString().split('T')[0];
    dateInput.setAttribute('min', today);

    // Numbers lang ang pwede i-type at hanggang 11 digits max
    phoneInput.addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '').slice(0, 11);
    });

    // Helper: kunin ang blocked date info mula sa Admin Clinic Schedule
    function getBlockedDate(selectedDate) {
      try {
        var blockedList = JSON.parse(localStorage.getItem('blockedDates')) || [];
        return blockedList.filter(function (item) {
          return item.date === selectedDate;
        })[0] || null;
      } catch (err) {
        return null;
      }
    }

    // I-update ang available time slots kapag pumili ng date ang pasyente
    function updateAvailableSlots() {
      var selectedDate = dateInput.value;
      var bookings = [];
      try {
        bookings = JSON.parse(localStorage.getItem('bookings')) || [];
      } catch (err) {
        bookings = [];
      }

      // I-reset lahat ng options
      Array.prototype.forEach.call(timeSelect.options, function (opt) {
        if (!opt.value) return;
        var baseLabel = opt.textContent.replace(' (Booked)', '');
        var isTaken = selectedDate && bookings.some(function (b) {
          return b.date === selectedDate && b.time === opt.value && b.status !== 'Cancelled';
        });

        opt.disabled = isTaken;
        opt.textContent = isTaken ? baseLabel + ' (Booked)' : baseLabel;
      });

      if (timeSelect.selectedOptions[0] && timeSelect.selectedOptions[0].disabled) {
        timeSelect.value = '';
      }
    }

    // Real-time check habang pumipili pa lang ng date ang pasyente
    dateInput.addEventListener('change', function () {
      var blocked = getBlockedDate(dateInput.value);
      if (blocked) {
        message.className = 'form-message error';
        message.textContent = 'Sorry, the clinic is closed on ' + blocked.date + ' (' + blocked.reason + '). Please choose another date.';
        submitBtn.disabled = true;
        timeSelect.disabled = true;
      } else {
        message.className = 'form-message';
        message.textContent = '';
        submitBtn.disabled = false;
        timeSelect.disabled = false;
        updateAvailableSlots();
      }
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      var phoneVal = phoneInput.value.trim();
      var isMobile = /^09\d{9}$/.test(phoneVal);
      var isLandline = /^(0\d{7,9}|\d{7,8})$/.test(phoneVal);

      if (!isMobile && !isLandline) {
        message.className = 'form-message error';
        message.textContent = 'Please enter a valid 11-digit mobile number (09XXXXXXXXX) or landline number.';
        phoneInput.focus();
        return;
      }

      var selectedDate = dateInput.value;
      var selectedTime = timeSelect.value;

      // 1. Check kung naka-block ang date sa Admin Panel
      var blocked = getBlockedDate(selectedDate);
      if (blocked) {
        message.className = 'form-message error';
        message.textContent = 'Sorry, the clinic is closed on ' + blocked.date + ' (' + blocked.reason + '). Please choose another date.';
        return;
      }

      try {
        var bookings = JSON.parse(localStorage.getItem('bookings')) || [];

        // 2. Check kung may naka-book na sa eksaktong date at time
        var isTaken = bookings.some(function (b) {
          return b.date === selectedDate && b.time === selectedTime && b.status !== 'Cancelled';
        });

        if (isTaken) {
          message.className = 'form-message error';
          message.textContent = 'That time slot is already booked. Please select a different time or date.';
          updateAvailableSlots();
          return;
        }

        var booking = {
          id: Date.now(),
          name: document.getElementById('name').value.trim(),
          phone: phoneVal,
          email: document.getElementById('email').value.trim(),
          service: document.getElementById('service').value,
          date: selectedDate,
          time: selectedTime,
          status: 'Pending',
          createdAt: new Date().toLocaleString()
        };

        bookings.push(booking);
        localStorage.setItem('bookings', JSON.stringify(bookings));

        message.className = 'form-message success';
        message.textContent = 'Thank you, ' + booking.name + '! Your booking has been submitted. We will confirm it soon.';
        form.reset();
        updateAvailableSlots();
      } catch (err) {
        message.className = 'form-message error';
        message.textContent = 'Sorry, something went wrong. Please try again.';
      }
    });
  </script>

</body>
</html>
