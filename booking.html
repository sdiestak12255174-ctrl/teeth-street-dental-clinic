<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an Appointment</title>
<style>
:root{--purple:#6B3FA8;--purple-dark:#55308A;--tint:#F1ECF9;--bg:#F6F2FB;--ink:#2A1A4A;--mute:#5E5870;--line:#D9CCEB;--field:#8C7AA8;--error:#B3261E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.page{min-height:100vh;display:flex;justify-content:center;padding:48px 24px}
.wrap{width:100%;max-width:600px}
a{color:var(--purple)}
a.back{display:inline-block;min-height:44px;line-height:44px;margin-bottom:8px;font-weight:500}
main{background:#fff;border:1px solid var(--line);border-radius:20px;padding:40px}
h1{margin:0 0 8px;font-size:2rem;line-height:1.2}
.lead{margin:0 0 28px;color:var(--mute)}
form{display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column}
label,legend{font-weight:600;font-size:.95rem;margin-bottom:6px;padding:0}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=time],select{width:100%;height:48px;border:1.5px solid var(--field);border-radius:10px;padding:0 14px;font:inherit;color:var(--ink);background:#fff}
.hint{margin:6px 0 0;font-size:.875rem;color:var(--mute)}
.error{margin:6px 0 0;font-size:.875rem;color:var(--error);font-weight:500}
[aria-invalid=true]{border-color:var(--error)!important}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.choice{display:flex;gap:12px;align-items:center;min-height:56px;padding:8px 14px;border:1.5px solid var(--field);border-radius:12px;background:#fff;cursor:pointer;margin:0}
.choice input{width:20px;height:20px;margin:0;accent-color:var(--purple)}
.choice b{display:block;font-weight:600}
.choice small{display:block;color:var(--mute);font-size:.875rem;font-weight:400}
.choice:has(input:checked){border:2px solid var(--purple);background:var(--tint)}
button{height:52px;border-radius:12px;font:600 1.05rem inherit;font-family:inherit;cursor:pointer;padding:0 20px}
.primary{border:0;background:var(--purple);color:#fff}
.primary:hover{background:var(--purple-dark)}
.secondary{border:1.5px solid var(--purple);background:#fff;color:var(--purple)}
.note{margin:0;text-align:center;font-size:.875rem;color:var(--mute)}
:focus-visible{outline:3px solid #1D4ED8;outline-offset:2px}
/* review + success */
dialog{border:0;border-radius:20px;padding:28px;max-width:520px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(42,26,74,.55)}
dl{margin:16px 0 24px;display:grid;grid-template-columns:auto 1fr;gap:8px 16px}
dt{color:var(--mute)}dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.actions{display:flex;gap:12px}
.actions button{flex:1}
@media (max-width:560px){
 .page{padding:16px}
 main{padding:20px;border-radius:16px}
 h1{font-size:1.625rem}
 .row,.choices{grid-template-columns:1fr}
 .actions{flex-direction:column-reverse}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page"><div class="wrap">
<a class="back" href="index.html">← Back to Home</a>
<main>
  <h1>Book an appointment</h1>
  <p class="lead">Fill out the form and our team will confirm your schedule.</p>

  <form id="form" novalidate>
    <div class="field">
      <label for="name">Full name</label>
      <input id="name" type="text" autocomplete="name" required aria-describedby="name-err">
      <p class="error" id="name-err" hidden></p>
    </div>
    <div class="field">
      <label for="phone">Phone / mobile number</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="09XXXXXXXXX or 02XXXXXXXX" required aria-describedby="phone-hint phone-err">
      <p class="hint" id="phone-hint">Mobile: 09XXXXXXXXX. Landline: 02XXXXXXXX.</p>
      <p class="error" id="phone-err" hidden></p>
    </div>
    <div class="field">
      <label for="email">Email</label>
