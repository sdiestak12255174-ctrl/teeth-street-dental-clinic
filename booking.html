<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book an Appointment - Teeth Street Dental Clinic</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #1f1933;
      line-height: 1.5;
      padding: 40px 20px;
    }

    .booking-wrapper {
      max-width: 640px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      color: #6d4aff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .booking-header {
      margin-bottom: 28px;
    }

    .booking-header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1a152e;
      margin-bottom: 6px;
    }

    .booking-header p {
      color: #5e5c6c;
      font-size: 0.95rem;
    }

    .booking-card {
      background-color: #ffffff;
      border: 1px solid #eceaf2;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .booking-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #2c283e;
    }

    input,
    select {
      width: 100%;
      padding: 11px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #1f1933;
      background-color: #ffffff;
      border: 1px solid #dcd9e6;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus,
    select:focus {
      border-color: #6638b6;
      box-shadow: 0 0 0 3px rgba(102, 56, 182, 0.12);
    }

    .btn-submit {
      align-self: flex-start;
      background-color: #6638b6;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 13px 26px;
      cursor: pointer;
      margin-top: 4px;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #522999;
    }

    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .booking-card {
        padding: 24px 20px;
      }

      .btn-submit {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="booking-wrapper">
    <a href="index.html" class="back-link">&larr; Back to Home</a>

    <header class="booking-header">
      <h1>Book an Appointment</h1>
      <p>Fill out the form and our team will confirm your schedule.</p>
    </header>

    <div class="booking-card">
      <form action="#" method="POST" class="booking-form">
        <div class="form-row">
          <div class="form-group">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="full_name" required>
          </div>

          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="service">Service</label>
          <select id="service" name="service" required>
            <option value="" disabled selected>Select a service</option>
            <option value="cleaning">Oral Prophylaxis (Cleaning)</option>
            <option value="consultation">Dental Check-up & Consultation</option>
            <option value="filling">Tooth Restoration (Pasta)</option>
            <option value="extraction">Tooth Extraction (Bunot)</option>
            <option value="whitening">Teeth Whitening</option>
            <option value="braces">Orthodontics / Braces</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date">Preferred Date</label>
            <input type="date" id="date" name="date" required>
          </div>

          <div class="form-group">
            <label for="time">Preferred Time</label>
            <input type="time" id="time" name="time" required>
          </div>
        </div>

        <button type="submit" class="btn-submit">Submit Booking</button>
      </form>
    </div>
  </main>
</body>
</html>
