<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book an Appointment - Teeth Street Dental Clinic</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #1f1933;
      line-height: 1.5;
      padding: 40px 20px;
    }

    .booking-wrapper {
      max-width: 640px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      color: #6d4aff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .booking-header {
      margin-bottom: 28px;
    }

    .booking-header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1a152e;
      margin-bottom: 6px;
    }

    .booking-header p {
      color: #5e5c6c;
      font-size: 0.95rem;
    }

    .booking-card {
      background-color: #ffffff;
      border: 1px solid #eceaf2;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .booking-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #2c283e;
    }

    .helper-text {
      font-size: 0.78rem;
      color: #6e6b7b;
      margin-top: -2px;
    }

    input,
    select {
      width: 100%;
      padding: 11px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #1f1933;
      background-color: #ffffff;
      border: 1px solid #dcd9e6;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus,
    select:focus {
      border-color: #6638b6;
      box-shadow: 0 0 0 3px rgba(102, 56, 182, 0.12);
    }

    .btn-submit {
      align-self: flex-start;
      background-color: #6638b6;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 13px 26px;
      cursor: pointer;
      margin-top: 4px;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #522999;
    }

    .success-banner {
      display: none;
      background-color: #e7f8ef;
      color: #137a45;
      border: 1px solid #b7ebd0;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 18px;
    }

    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      .booking-card {
        padding: 24px 20px;
      }
      .btn-submit {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="booking-wrapper">
    <a href="index.html" class="back-link">&larr; Back to Home</a>

    <header class="booking-header">
      <h1>Book an Appointment</h1>
      <p>Fill out the form and our team will confirm your schedule.</p>
    </header>

    <div class="booking-card">
      <div class="success-banner" id="success-banner">
        Appointment submitted! Our team will confirm your schedule shortly.
      </div>

      <form id="booking-form" class="booking-form">
        <div class="form-row">
          <div class="form-group">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="full_name" required>
          </div>

          <div class="form-group">
            <label for="phone">Phone / Mobile Number</label>
            <input 
              type="tel" 
              id="phone" 
              name="phone" 
              inputmode="numeric"
              placeholder="09XXXXXXXXX or 02XXXXXXXX" 
              pattern="^(09\d{9}|0\d{9})$"
              title="Enter an 11-digit mobile number (09XXXXXXXXX) or 10-digit landline (02XXXXXXXX)"
              required
            >
            <span class="helper-text" id="phone-hint">Mobile: 11 digits (09...) | Landline: 10 digits (02...)</span>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="name@email.com" required>
        </div>

        <div class="form-group">
          <label for="service">Service</label>
          <select id="service" name="service" required>
            <option value="" disabled selected>Select a service</option>
            <option value="General Dentistry">General Dentistry</option>
            <option value="Orthodontics">Orthodontics</option>
            <option value="Cosmetic Dentistry">Cosmetic Dentistry</option>
            <option value="Pediatric Dentistry">Pediatric Dentistry</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date">Preferred Date</label>
            <input type="date" id="date" name="date" required>
          </div>

          <div class="form-group">
            <label for="time">Preferred Time</label>
            <input type="time" id="time" name="time" required>
          </div>
        </div>

        <button type="submit" class="btn-submit">Submit Booking</button>
      </form>
    </div>
  </main>

  <script>
    const phoneInput = document.getElementById('phone');
    const phoneHint = document.getElementById('phone-hint');

    phoneInput.addEventListener('input', function () {
      let digits = this.value.replace(/\D/g, '');
      if (digits.startsWith('09')) {
        digits = digits.slice(0, 11);
        phoneHint.textContent = `Mobile number (${digits.length}/11 digits)`;
      } else if (digits.startsWith('0')) {
        digits = digits.slice(0, 10);
        phoneHint.textContent = `Landline number (${digits.length}/10 digits)`;
      } else {
        digits = digits.slice(0, 11);
        phoneHint.textContent = 'Mobile: 11 digits (09...) | Landline: 10 digits (02...)';
      }
      this.value = digits;
    });

    // Save booking to localStorage so it appears in admin.html
    document.getElementById('booking-form').addEventListener('submit', function (e) {
      e.preventDefault();

      const fullName = document.getElementById('full-name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const service = document.getElementById('service').value;
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;

      const appointments = JSON.parse(localStorage.getItem('tsdc_appointments') || '[]');
      appointments.unshift({
        id: Date.now(),
        name: fullName,
        phone: phone,
        email: email,
        service: service,
        date: date,
        time: time,
        status: 'Pending'
      });
      localStorage.setItem('tsdc_appointments', JSON.stringify(appointments));

      // Also save to patient list if not existing
      const patients = JSON.parse(localStorage.getItem('tsdc_patients') || '[]');
      const exists = patients.some(p => p.name.toLowerCase() === fullName.toLowerCase() || p.phone === phone);
      if (!exists) {
        const nextNum = String(patients.length + 1).padStart(3, '0');
        patients.unshift({
          id: 'PT-' + nextNum,
          name: fullName,
          phone: phone,
          email: email,
          lastVisit: date,
          notes: 'Booked ' + service
        });
        localStorage.setItem('tsdc_patients', JSON.stringify(patients));
      }

      document.getElementById('success-banner').style.display = 'block';
      this.reset();
      phoneHint.textContent = 'Mobile: 11 digits (09...) | Landline: 10 digits (02...)';
    });
  </script>
</body>
</html>
